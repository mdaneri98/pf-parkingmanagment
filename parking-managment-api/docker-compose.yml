version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parking_postgres
    environment:
      POSTGRES_DB: parking_management
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - parking_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parking_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "parking_password"]
    networks:
      - parking_network
    restart: unless-stopped

  api:
    build: .
    container_name: parking_api
    ports:
      - "3000:3000"
    environment:
      # Spring Profile (local, dev, or prod)
      SPRING_PROFILES_ACTIVE: dev

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parking_management
      SPRING_DATASOURCE_USERNAME: parking_user
      SPRING_DATASOURCE_PASSWORD: parking_password

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: parking_password

      # JWT Configuration (use a secure secret in production)
      JWT_SECRET: your-secret-key-here-make-it-long-and-secure-in-production-change-this
      JWT_EXPIRATION: 86400000

      # Java Options
      JAVA_OPTS: -Xms256m -Xmx512m
    depends_on:
      - postgres
      - redis
    networks:
      - parking_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  parking_network:
    driver: bridge
