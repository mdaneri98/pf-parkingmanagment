spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/parking_management
    driver-class-name: org.postgresql.Driver
    username: parking_user
    password: parking_password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20

# Redis configuration
redis:
  host: localhost
  port: 6379
  database: 0
  password: parking_password
  timeout: 2000

# Logging configuration for production
logging:
  level:
    ar.edu.itba.parkingmanagmentapi: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.data.redis: INFO
    io.lettuce.core: WARN
    org.springframework.data.redis.core: INFO
  file:
    name: logs/parking-management-api.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
